name: Update GA4 and Adsterra Ads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GA4 and Adsterra ads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          GA4_ID = "G-4K2LMKJLTV"

          TOP_AD = r'''
          <!-- Adsterra Top Banner -->
          <div class="adsterra-top-banner">
            <script>
              atOptions = {
                'key' : 'c61926a6cb30f528bfde6f4878bf66d7',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/c61926a6cb30f528bfde6f4878bf66d7/invoke.js"></script>
          </div>
          '''

          MID_AD = r'''
          <!-- Adsterra Mid Banner -->
          <div class="adsterra-mid-banner">
            <script>
              atOptions = {
                'key' : '742caef2ced20e328dd6d44f4f0d2026',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/742caef2ced20e328dd6d44f4f0d2026/invoke.js"></script>
          </div>
          '''

          GA4 = f'''
          <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={GA4_ID}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{GA4_ID}');
          </script>
          '''

          for path in Path(".").rglob("*.html"):

              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")

              # -----------------------------------------
              # 1. REMOVE GOOGLE ADSENSE
              # -----------------------------------------

              text = re.sub(
                  r'<script[^>]*pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js[^>]*>.*?</script>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r'<meta[^>]*google-adsense-account[^>]*>',
                  '',
                  text,
                  flags=re.I
              )

              # Remove common AdSense blocks
              text = re.sub(
                  r'<!--\s*Google AdSense\s*-->.*?(?=<script|</head>|</body>)',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # -----------------------------------------
              # 2. REMOVE OLD GA4
              # -----------------------------------------

              text = re.sub(
                  r'<!--\s*Google tag \(gtag\.js\)\s*-->.*?'
                  r'<\/script>\s*',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # -----------------------------------------
              # 3. REMOVE OLD ADSTERRA INSERTIONS
              # -----------------------------------------

              text = re.sub(
                  r'<!--\s*Adsterra Top Banner\s*-->.*?'
                  r'<\/div>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r'<!--\s*Adsterra Mid Banner\s*-->.*?'
                  r'<\/div>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # Remove previous standalone Adsterra containers
              text = re.sub(
                  r'<div[^>]*class=["\']adsterra-top-banner["\'][^>]*>.*?</div>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r'<div[^>]*class=["\']adsterra-mid-banner["\'][^>]*>.*?</div>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # -----------------------------------------
              # 4. ADD GA4 BEFORE </head>
              # -----------------------------------------

              if re.search(r'</head>', text, flags=re.I):

                  text = re.sub(
                      r'</head>',
                      GA4 + '\n</head>',
                      text,
                      count=1,
                      flags=re.I
                  )

              # -----------------------------------------
              # 5. TOP AD INSIDE EXISTING TOP AD SPACE
              # -----------------------------------------

              top_pattern = (
                  r'(<div\s+class=["\']ad-top["\'][^>]*>\s*'
                  r'<div\s+class=["\']adslot["\'][^>]*>)'
                  r'.*?'
                  r'(</div>\s*</div>)'
              )

              if re.search(top_pattern, text, flags=re.I | re.S):

                  text = re.sub(
                      top_pattern,
                      lambda m: m.group(1) + TOP_AD + m.group(2),
                      text,
                      count=1,
                      flags=re.I | re.S
                  )

                  print("Top Ad placed inside ad-top:", path)

              else:
                  print("Top ad space NOT found:", path)

              # -----------------------------------------
              # 6. MID AD INSIDE EXISTING MID AD SPACE
              # -----------------------------------------

              mid_pattern = (
                  r'(<div\s+class=["\']ad-mid["\'][^>]*>\s*'
                  r'<div\s+class=["\']adslot["\'][^>]*>)'
                  r'.*?'
                  r'(</div>\s*</div>)'
              )

              if re.search(mid_pattern, text, flags=re.I | re.S):

                  text = re.sub(
                      mid_pattern,
                      lambda m: m.group(1) + MID_AD + m.group(2),
                      text,
                      count=1,
                      flags=re.I | re.S
                  )

                  print("Mid Ad placed inside ad-mid:", path)

              else:
                  print("Mid ad space NOT found:", path)

              path.write_text(text, encoding="utf-8")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Adsterra ads inside ad spaces"
            git push
          fi
