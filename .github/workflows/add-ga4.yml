name: Add GA4 and AdSense to all HTML files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GA4 and AdSense
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          GA4 = "G-4K2LMKJLTV"
          ADSENSE = "ca-pub-6743162164680988"

          ga4 = f'''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={GA4}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{GA4}');
          </script>'''

          adsense = f'''<!-- Google AdSense -->
          <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={ADSENSE}"
               crossorigin="anonymous"></script>'''

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove existing GA4 code
              text = re.sub(
                  r'<!-- Google tag \(gtag\.js\) -->.*?</script>\s*</script>',
                  '',
                  text,
                  flags=re.S
              )

              # Remove existing AdSense site code
              text = re.sub(
                  r'<!-- Google AdSense -->.*?crossorigin=["\']anonymous["\']></script>',
                  '',
                  text,
                  flags=re.S
              )

              # Add both codes before </head>
              if re.search(r'</head>', text, re.I):
                  text = re.sub(
                      r'</head>',
                      ga4 + '\n' + adsense + '\n</head>',
                      text,
                      count=1,
                      flags=re.I
                  )

                  path.write_text(text, encoding="utf-8")
                  print("Updated:", path)

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add GA4 and AdSense to all HTML pages"
          git push
