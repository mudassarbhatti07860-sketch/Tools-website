name: Add GA4 and Adsterra to all HTML files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GA4 and Adsterra
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          GA4 = "G-4K2LMKJLTV"

          ga4 = f'''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={GA4}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{GA4}');
          </script>'''

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove old GA4 code
              text = re.sub(
                  r'<!-- Google tag \(gtag\.js\) -->.*?gtag\([\'"]config[\'"].*?</script>',
                  '',
                  text,
                  flags=re.S
              )

              # Remove old AdSense site code
              text = re.sub(
                  r'<!-- Google AdSense -->.*?crossorigin=["\']anonymous["\']\s*></script>',
                  '',
                  text,
                  flags=re.S
              )

              # Add GA4 before </head>
              if re.search(r'</head>', text, re.I):
                  text = re.sub(
                      r'</head>',
                      ga4 + '\n</head>',
                      text,
                      count=1,
                      flags=re.I
                  )

              path.write_text(text, encoding="utf-8")
              print("Updated:", path)

          PY

      - name: Add Adsterra top banner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adsterra = '''<!-- Adsterra Top Banner -->
          <div class="adsterra-top-banner" style="width:100%; max-width:728px; margin:15px auto; text-align:center;">
            <script>
              atOptions = {
                'key' : 'c61926a6cb30f528bfde6f4878bf66d7',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/c61926a6cb30f528bfde6f4878bf66d7/invoke.js"></script>
          </div>'''

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove previously inserted Adsterra top banner
              text = text.replace(adsterra, "")

              # Put Adsterra after <body>
              if "<body" in text.lower():
                  import re
                  text = re.sub(
                      r'(<body[^>]*>)',
                      r'\1\n' + adsterra,
                      text,
                      count=1,
                      flags=re.I
                  )

              path.write_text(text, encoding="utf-8")
              print("Adsterra added:", path)

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add GA4 and Adsterra banner to all HTML pages"
          git push
