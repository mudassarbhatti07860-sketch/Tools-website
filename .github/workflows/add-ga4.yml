name: Update GA4 and Adsterra

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update all HTML files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          GA4 = "G-4K2LMKJLTV"

          ga4 = f'''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={GA4}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{GA4}');
          </script>'''

          adsterra = '''<!-- Adsterra Top Banner -->
          <div class="adsterra-top-banner" style="width:100%; max-width:728px; margin:15px auto; text-align:center;">
            <script>
              atOptions = {
                'key' : 'c61926a6cb30f528bfde6f4878bf66d7',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/c61926a6cb30f528bfde6f4878bf66d7/invoke.js"></script>
          </div>'''

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")

              # Remove ALL Google AdSense code blocks
              text = re.sub(
                  r'<!--\s*Google AdSense.*?-->\s*'
                  r'<script[^>]+src=["\']https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js[^>]*>.*?</script>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # Remove AdSense meta/google-adsense related code
              text = re.sub(
                  r'<meta[^>]+name=["\']google-adsense-account["\'][^>]*>\s*',
                  '',
                  text,
                  flags=re.I
              )

              # Remove previously inserted GA4
              text = re.sub(
                  r'<!--\s*Google tag \(gtag\.js\)\s*-->.*?'
                  r'gtag\(\s*[\'"]config[\'"]\s*,\s*[\'"]G-[A-Z0-9]+[\'"]\s*\)\s*;.*?</script>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # Remove previously inserted Adsterra banner
              text = re.sub(
                  r'<!--\s*Adsterra Top Banner\s*-->.*?</div>',
                  '',
                  text,
                  flags=re.I | re.S
              )

              # Add GA4 before </head>
              if re.search(r'</head>', text, re.I):
                  text = re.sub(
                      r'</head>',
                      ga4 + '\n</head>',
                      text,
                      count=1,
                      flags=re.I
                  )

              # Add Adsterra immediately after <body>
              if re.search(r'<body[^>]*>', text, re.I):
                  text = re.sub(
                      r'(<body[^>]*>)',
                      r'\1\n' + adsterra,
                      text,
                      count=1,
                      flags=re.I
                  )

              path.write_text(text, encoding="utf-8")
              print("Updated:", path)

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove AdSense and update GA4 and Adsterra"
            git push
          fi
