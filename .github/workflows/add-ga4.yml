name: ToolNex - GA4 and Adsterra Ads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # UPDATE HTML FILES
      # =========================
      - name: Add GA4 and Adsterra
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          GA4_ID = "G-4K2LMKJLTV"

          # ==========================================
          # GA4
          # ==========================================

          GA4_CODE = f'''
          <!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={GA4_ID}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{GA4_ID}');
          </script>
          '''

          # ==========================================
          # TOP BANNER ADS TERRA
          # 728x90
          # ==========================================

          TOP_AD = '''
          <!-- TOOLNEX ADSTERRA TOP BANNER START -->
          <div class="toolnex-adsterra-top">
            <script>
              atOptions = {
                'key' : 'c61926a6cb30f528bfde6f4878bf66d7',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/c61926a6cb30f528bfde6f4878bf66d7/invoke.js"></script>
          </div>
          <!-- TOOLNEX ADSTERRA TOP BANNER END -->
          '''

          # ==========================================
          # MID BANNER ADSTERRA
          # 300x250
          # ==========================================

          MID_AD = '''
          <!-- TOOLNEX ADSTERRA MID BANNER START -->
          <div class="toolnex-adsterra-mid">
            <script>
              atOptions = {
                'key' : '742caef2ced20e328dd6d44f4f0d2026',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/742caef2ced20e328dd6d44f4f0d2026/invoke.js"></script>
          </div>
          <!-- TOOLNEX ADSTERRA MID BANNER END -->
          '''

          # ==========================================
          # FIND ALL HTML FILES
          # ==========================================

          html_files = [
              p for p in Path(".").rglob("*.html")
              if ".git" not in p.parts
          ]

          print("HTML files found:", len(html_files))

          # ==========================================
          # PROCESS EACH HTML FILE
          # ==========================================

          for path in html_files:

              print("\nProcessing:", path)

              text = path.read_text(encoding="utf-8")

              # --------------------------------------
              # REMOVE ALL OLD ADS TERRA INSERTIONS
              # --------------------------------------

              text = re.sub(
                  r'<!-- TOOLNEX ADSTERRA TOP BANNER START -->.*?<!-- TOOLNEX ADSTERRA TOP BANNER END -->',
                  '',
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r'<!-- TOOLNEX ADSTERRA MID BANNER START -->.*?<!-- TOOLNEX ADSTERRA MID BANNER END -->',
                  '',
                  text,
                  flags=re.S | re.I
              )

              # Remove old adsterra containers
              text = re.sub(
                  r'<div[^>]*class=["\']adsterra-top-banner["\'][^>]*>.*?</div>',
                  '',
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r'<div[^>]*class=["\']adsterra-mid-banner["\'][^>]*>.*?</div>',
                  '',
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r'<div[^>]*class=["\']toolnex-adsterra-top["\'][^>]*>.*?</div>',
                  '',
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r'<div[^>]*class=["\']toolnex-adsterra-mid["\'][^>]*>.*?</div>',
                  '',
                  text,
                  flags=re.S | re.I
              )

              # --------------------------------------
              # REMOVE GOOGLE ADSENSE
              # --------------------------------------

              text = re.sub(
                  r'<script[^>]+pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js[^>]*>.*?</script>',
                  '',
                  text,
                  flags=re.S | re.I
              )

              text = re.sub(
                  r'<meta[^>]+google-adsense-account[^>]*>',
                  '',
                  text,
                  flags=re.S | re.I
              )

              # --------------------------------------
              # REMOVE OLD GA4
              # --------------------------------------

              text = re.sub(
                  r'<!-- Google tag \(gtag\.js\) -->.*?'
                  r'gtag\([\'"]config[\'"]\s*,\s*[\'"]G-[A-Z0-9]+[\'"]\s*\)\s*;'
                  r'.*?</script>',
                  '',
                  text,
                  flags=re.S | re.I
              )

              # --------------------------------------
              # ADD GA4 ONCE
              # --------------------------------------

              if re.search(r'</head>', text, re.I):

                  text = re.sub(
                      r'</head>',
                      GA4_CODE + '\n</head>',
                      text,
                      count=1,
                      flags=re.I
                  )

                  print("GA4 added")

              # ======================================
              # TOP AD SPACE
              # ======================================

              top_pattern = re.compile(
                  r'(<div\s+class=["\']ad-top["\'][^>]*>\s*'
                  r'<div\s+class=["\']adslot["\'][^>]*>)'
                  r'(.*?)'
                  r'(</div>\s*</div>)',
                  flags=re.S | re.I
              )

              top_match = top_pattern.search(text)

              if top_match:

                  new_top = (
                      top_match.group(1)
                      + '\n'
                      + TOP_AD
                      + '\n'
                      + top_match.group(3)
                  )

                  text = (
                      text[:top_match.start()]
                      + new_top
                      + text[top_match.end():]
                  )

                  print("TOP AD INSERTED INSIDE .ad-top .adslot")

              else:
                  print("WARNING: TOP AD SPACE NOT FOUND")

              # ======================================
              # MID AD SPACE
              # ======================================

              mid_pattern = re.compile(
                  r'(<div\s+class=["\']ad-mid["\'][^>]*>\s*'
                  r'<div\s+class=["\']adslot["\'][^>]*>)'
                  r'(.*?)'
                  r'(</div>\s*</div>)',
                  flags=re.S | re.I
              )

              mid_match = mid_pattern.search(text)

              if mid_match:

                  new_mid = (
                      mid_match.group(1)
                      + '\n'
                      + MID_AD
                      + '\n'
                      + mid_match.group(3)
                  )

                  text = (
                      text[:mid_match.start()]
                      + new_mid
                      + text[mid_match.end():]
                  )

                  print("MID AD INSERTED INSIDE .ad-mid .adslot")

              else:
                  print("WARNING: MID AD SPACE NOT FOUND")

              # ======================================
              # WRITE FILE
              # ======================================

              path.write_text(text, encoding="utf-8")

          print("\nFinished processing all HTML files.")

          PY

      # =========================
      # VERIFY ADS
      # =========================
      - name: Verify Adsterra placement
        run: |
          echo "Checking Adsterra placement..."

          TOP_COUNT=$(grep -RIl "c61926a6cb30f528bfde6f4878bf66d7" --include="*.html" . | wc -l || true)
          MID_COUNT=$(grep -RIl "742caef2ced20e328dd6d44f4f0d2026" --include="*.html" . | wc -l || true)

          echo "Top Ad files: $TOP_COUNT"
          echo "Mid Ad files: $MID_COUNT"

          if [ "$TOP_COUNT" -eq 0 ]; then
            echo "ERROR: Top Adsterra code was not found."
            exit 1
          fi

          if [ "$MID_COUNT" -eq 0 ]; then
            echo "ERROR: Mid Adsterra code was not found."
            exit 1
          fi

          echo "Adsterra codes found successfully."

      # =========================
      # COMMIT
      # =========================
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Adsterra ads inside ad spaces"
            git push
          fi
